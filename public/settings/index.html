<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>마피아 설정</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/settings/settings.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><h1>게임 설정</h1><span id="sync" class="sync"></span></div>
    <nav class="top-actions">
      <button type="button" class="btn sm" data-act="export">내보내기</button>
      <label class="btn sm">불러오기<input type="file" id="import" accept="application/json,.json" hidden></label>
      <button type="button" class="btn sm" data-act="reset">기본값 복원</button>
      <a class="btn sm" href="/" data-act="back">콘솔로</a>
      <button type="button" class="btn sm primary" data-act="save" id="btn-save">저장</button>
    </nav>
  </header>
  <main id="form" class="wrap"></main>

  <link rel="stylesheet" href="/css/dialog.css">
  <script src="/js/dialog.js"></script>
  <script type="module" src="/settings/settings.js"></script>
</body>
</html>
