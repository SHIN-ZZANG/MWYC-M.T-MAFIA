<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>마피아 사회자 콘솔</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/console.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>마피아 사회자 콘솔</h1>
      <span id="phase-badge" class="phase-badge"></span>
      <span id="sync" class="sync"></span>
    </div>
    <nav class="top-actions">
      <button type="button" class="btn sm" data-act="open-display">참가자 화면 열기</button>
      <button type="button" class="btn sm" data-act="toggle-roles" id="btn-hide">역할 가리기</button>
      <button type="button" class="btn sm" data-act="undo" id="btn-undo">되돌리기</button>
      <a class="btn sm" href="/settings/">설정</a>
      <button type="button" class="btn sm danger" data-act="new-game" id="btn-new">새 게임</button>
    </nav>
  </header>

  <div class="layout">
    <main id="stage" class="stage"></main>
    <aside class="side" id="side"></aside>
  </div>

  <link rel="stylesheet" href="/css/dialog.css">
  <script src="/js/dialog.js"></script>
  <script type="module" src="/js/console.js"></script>
</body>
</html>
